<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jimpae Profile｜花生證</title>
  <meta name="description" content="登入 Twitch 查看你嘅 Jimpae 花生證 profile。" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--background:#071017;--foreground:#f2fbff;--muted:#91a9b7;--border:rgba(255,255,255,.10);--primary:#6ed6ff;--primary-2:#a7f3ff;--on-primary:#031018;--good:#86efac;--warn:#ffd166;--shadow:0 24px 80px rgba(0,0,0,.45)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'DM Sans','Noto Sans TC',system-ui,-apple-system,sans-serif;color:var(--foreground);background:radial-gradient(circle at 15% 5%,rgba(110,214,255,.22),transparent 28rem),radial-gradient(circle at 85% 10%,rgba(167,243,255,.13),transparent 26rem),linear-gradient(180deg,#06131d 0%,var(--background) 44%,#05090d 100%)}
    .shell{width:min(960px,100%);margin:0 auto;padding:28px 18px 56px}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--on-primary);box-shadow:0 0 34px rgba(110,214,255,.28)}.logo svg{width:22px;height:22px}.nav a{color:var(--muted);text-decoration:none}.panel{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.hero{padding:34px;margin-bottom:20px}.eyebrow{display:inline-flex;color:var(--primary);font-weight:900;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}h1{font-size:clamp(38px,7vw,68px);line-height:.95;margin:0 0 16px;letter-spacing:-.055em}.subtitle{color:#cbe1eb;font-size:18px;line-height:1.65;margin:0;max-width:70ch}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:12px 18px;font-weight:900;text-decoration:none;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--on-primary)}.btn-ghost{background:rgba(255,255,255,.06);color:var(--foreground);border:1px solid var(--border)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:22px}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.stat{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}.stat:last-child{border-bottom:0}.pill-row{display:flex;flex-wrap:wrap;gap:10px}.season{display:inline-flex;align-items:center;border-radius:999px;padding:9px 13px;background:rgba(110,214,255,.12);border:1px solid rgba(110,214,255,.28);font-weight:900}.ok{color:var(--good)}.warn{color:var(--warn)}.error{color:#ff9ca3}.hidden{display:none}.loading{padding:22px;color:var(--muted)}code{background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:8px;padding:2px 6px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding:24px}.nav{align-items:flex-start}.actions{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 16.5 12 4l7 12.5-7-3.2-7 3.2Z" fill="currentColor"/><path d="M8 18.5h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><span>Jimpae Profile</span></div>
      <a href="/">← 返回 Homepage</a>
    </nav>

    <section class="panel hero">
      <div class="eyebrow">Peanut Pass Profile</div>
      <h1>花生證 Profile</h1>
      <p class="subtitle">用 Twitch 登入，查看你擁有嘅花生證 season，同 Discord 連結狀態。資料由直播系統同步，可能有少少延遲。</p>
      <div class="actions" id="actions">
        <a class="btn btn-primary" id="loginBtn" href="#">Login with Twitch</a>
        <a class="btn btn-primary hidden" id="discordBtn" href="#">Connect Discord</a>
        <button class="btn btn-ghost hidden" id="logoutBtn">Logout</button>
      </div>
    </section>

    <section class="grid">
      <article class="panel card">
        <h2>帳號狀態</h2>
        <div id="accountBox" class="loading">載入中...</div>
      </article>
      <article class="panel card">
        <h2>花生證 Seasons</h2>
        <div id="seasonBox" class="loading">登入後顯示。</div>
      </article>
    </section>

    <section class="panel card" style="margin-top:14px">
      <h3>點樣連 Discord？</h3>
      <p class="muted">先用 Twitch 登入。若 Discord 未連結，頁面上方會出現 <strong>Connect Discord</strong> 按鈕；按完授權 Discord 後，系統會自動合併你已有嘅花生證身份組。</p>
    </section>
  </main>

  <script>
    const API = 'https://peanut-api.jimpae.info';
    const $ = id => document.getElementById(id);
    const escapeHtml = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const returnTo = `${location.origin}${location.pathname}`;

    $('loginBtn').href = `${API}/profile/twitch/login?return_to=${encodeURIComponent(returnTo)}`;
    $('discordBtn').href = `${API}/profile/discord/login?return_to=${encodeURIComponent(returnTo)}`;
    $('logoutBtn').addEventListener('click', async () => {
      await fetch(`${API}/profile/logout`, {method:'POST', credentials:'include'}).catch(()=>{});
      location.reload();
    });

    function renderLoggedOut(message='尚未登入 Twitch。'){
      $('loginBtn').classList.remove('hidden');
      $('discordBtn').classList.add('hidden');
      $('logoutBtn').classList.add('hidden');
      $('accountBox').innerHTML = `<p class="muted">${escapeHtml(message)}</p>`;
      $('seasonBox').innerHTML = '<p class="muted">登入後會顯示你擁有嘅花生證。</p>';
    }

    function renderProfile(data){
      const profile = data.profile || {};
      $('loginBtn').classList.add('hidden');
      $('discordBtn').classList.toggle('hidden', !!profile.discord_linked || !!data.discord_pending);
      $('logoutBtn').classList.remove('hidden');
      const display = profile.twitch_display_name || data.twitch_login || profile.twitch_login || 'Twitch Viewer';
      const login = profile.twitch_login || data.twitch_login || '';
      const discord = profile.discord_linked ? '<span class="ok">已連結</span>' : (data.discord_pending ? '<span class="warn">連結處理中</span>' : '<span class="warn">未連結</span>');
      const synced = profile.last_synced_at ? new Date(profile.last_synced_at).toLocaleString('zh-HK', {hour12:false}) : '未有同步時間';
      $('accountBox').innerHTML = `
        <div class="stat"><strong>Twitch</strong><span>${escapeHtml(display)}</span></div>
        <div class="stat"><strong>Username</strong><span>${escapeHtml(login ? '@'+login : '—')}</span></div>
        <div class="stat"><strong>Discord</strong><span>${discord}</span></div>
        <div class="stat"><strong>最後同步</strong><span>${escapeHtml(synced)}</span></div>
      `;
      const seasons = data.seasons || [];
      $('seasonBox').innerHTML = seasons.length
        ? `<div class="pill-row">${seasons.map(s => `<span class="season">S${escapeHtml(s.season_number)}</span>`).join('')}</div>`
        : '<p class="muted">未見到花生證。兌換後等系統同步再返嚟睇。</p>';
    }

    async function init(){
      try{
        const res = await fetch(`${API}/profile/me`, {credentials:'include'});
        const data = await res.json().catch(()=>({}));
        if(res.status === 401){ renderLoggedOut(); return; }
        if(!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        renderProfile(data);
      }catch(e){
        $('accountBox').innerHTML = `<p class="error">Profile 載入失敗：${escapeHtml(e.message)}</p>`;
        $('seasonBox').innerHTML = '<p class="muted">請稍後再試。</p>';
      }
    }
    init();
  </script>
</body>
</html>
