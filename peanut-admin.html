<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peanut Admin</title>
  <style>
    body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#091014;color:#e8f6f2;margin:0;padding:18px} a{color:#78e0c3}.wrap{max-width:1280px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#0f1c22;border:1px solid #21414a;border-radius:14px;padding:14px;box-shadow:0 8px 28px #0006}.muted{color:#89a6a9}.ok{color:#77e58f}.bad{color:#ff7b7b}.warn{color:#ffd166}button{background:#1a5362;color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #1f3940;padding:7px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#13252c;z-index:1;cursor:pointer;user-select:none}th:hover{background:#1b3740}.scroll{max-height:520px;overflow:auto;border:1px solid #1f3940;border-radius:10px}.pill{display:inline-block;border:1px solid #2f6673;border-radius:999px;padding:2px 8px;margin:2px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}input{background:#081116;color:#fff;border:1px solid #2b515b;border-radius:8px;padding:8px}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
</head>
<body><div class="wrap">
  <h1>Peanut Admin</h1>
  <div class="toolbar"><a href="/profile">返回 Profile</a><button id="refresh">重新整理</button><input id="viewerSearch" placeholder="搜尋 viewer handle / ID / Discord" /><button id="searchBtn">搜尋</button><span id="status" class="muted"></span></div>
  <div id="root"></div>
</div>
<script>
const API='https://peanut-api.jimpae.info';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cls(status){ status=String(status||''); if(['applied','synced','ok','already_owned'].includes(status))return'ok'; if(['failed','error'].some(x=>status.includes(x)))return'bad'; return 'warn'; }
let sortState={};
function sortVal(r,c){
 if(typeof c[2]==='function') return c[2](r);
 const k=c[2]||c[1];
 if(typeof k==='string') return r[k];
 return '';
}
function cmp(a,b){
 const na=Number(a), nb=Number(b);
 if(a!==''&&b!==''&&!Number.isNaN(na)&&!Number.isNaN(nb)) return na-nb;
 const da=Date.parse(a), db=Date.parse(b);
 if(!Number.isNaN(da)&&!Number.isNaN(db)) return da-db;
 return String(a??'').localeCompare(String(b??''),'zh-Hant',{numeric:true,sensitivity:'base'});
}
function table(id, rows, cols){
 const st=sortState[id]||{idx:0,dir:'desc'};
 const sorted=[...(rows||[])].sort((a,b)=>cmp(sortVal(a,cols[st.idx]),sortVal(b,cols[st.idx]))*(st.dir==='asc'?1:-1));
 return `<div class="scroll"><table data-table="${esc(id)}"><thead><tr>${cols.map((c,i)=>`<th data-sort="${i}">${esc(c[0])}${st.idx===i?(st.dir==='asc'?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${sorted.map(r=>`<tr>${cols.map(c=>`<td>${typeof c[1]==='function'?c[1](r):esc(r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
}
function userLabel(r){
 const login=r.twitch_login||r.platform_login||r.youtube_handle||r.discord_username||r.viewer_label||'';
 const display=r.twitch_display_name||r.youtube_display_name||r.display_name||'';
 if(login && display && String(login).toLowerCase()!==String(display).toLowerCase()) return `${esc(login)} <span class="muted">（${esc(display)}）</span>`;
 return esc(login||display||'—');
}
function norm(s){return String(s||'').trim().toLowerCase().replace(/^@/,'')}
function viewerMatches(v,q){
 q=norm(q); if(!q) return false;
 return [v.viewer_id,v.twitch_user_id,v.twitch_login,v.twitch_display_name,v.youtube_channel_id,v.youtube_handle,v.youtube_display_name,v.discord_user_id,v.discord_username].some(x=>norm(x).includes(q));
}
function viewerSearchHtml(d){
 const q=viewerSearch?.value||''; if(!q.trim()) return '';
 const matches=(d.viewers||[]).filter(v=>viewerMatches(v,q)).slice(0,20);
 if(!matches.length) return `<div class="card"><h2>Viewer Search</h2><p class="warn">搵唔到：${esc(q)}</p></div>`;
 const cards=matches.map(v=>{
   const vid=Number(v.viewer_id);
   const s57=(d.s57_redeems||[]).filter(r=>Number(r.viewer_id)===vid);
   const pts=(d.points_redeems||[]).filter(r=>norm(r.platform_user_id)===norm(v.twitch_user_id)||norm(r.platform_login)===norm(v.twitch_login));
   const ds=(d.discord_sync||[]).filter(r=>Number(r.viewer_id)===vid);
   const idc=(d.identity_changes||[]).filter(r=>Number(r.viewer_id)===vid);
   const seasons=(v.seasons||[]).slice().sort((a,b)=>a-b).map(s=>`<span class="pill">S${esc(s)}</span>`).join('')||'<span class="muted">無</span>';
   const lb=v.leaderboard_row||{};
   const elig=v.s57_eligibility||{};
   const role=v.s57_discord_status||{};
   const timeline=[...s57.map(x=>({...x,_type:'S57'})),...pts.map(x=>({...x,_type:'PTS'})),...ds.map(x=>({...x,_type:'Discord'})),...idc.map(x=>({...x,_type:'Identity'}))]
     .sort((a,b)=>Date.parse(b.created_at||0)-Date.parse(a.created_at||0)).slice(0,20);
   return `<div class="card"><h2>${userLabel(v)} <span class="muted">#${esc(vid)}</span></h2>
    <div class="grid"><div><b>Profile Cache PTS</b><p>${esc(v.points??'—')} ${v.points_rank?`· #${esc(v.points_rank)}`:''}<br><span class="muted small">顯示用 cache；扣分以 Live Leaderboard Row 為準。</span></p></div><div><b>S57 Eligibility</b><p><span class="${elig.can_redeem?'ok':'warn'}">${elig.can_redeem?'可兌換':'不可兌換'}</span><br><span class="muted">${esc(elig.reason||'—')}</span></p></div><div><b>Live Leaderboard Row</b><p>${lb.rowid?`${esc(lb.platform)} · ${esc(lb.match_method)}<br>${esc(lb.userName)} / ${esc(lb.userId)}<br>${esc(lb.points)} PTS · ${esc(lb.updated_at)}`:'<span class="warn">No row found</span>'}</p></div><div><b>S57 Discord Role</b><p><span class="${cls(role.status)}">${esc(role.status||'—')}</span><br><span class="muted">${esc(role.message||'')}</span></p></div><div><b>Twitch</b><p>${esc(v.twitch_login||'—')} ${v.twitch_display_name?`（${esc(v.twitch_display_name)}）`:''}<br><span class="muted">${esc(v.twitch_user_id||'')}</span></p></div><div><b>YouTube</b><p>${esc(v.youtube_handle||'—')} ${v.youtube_display_name?`（${esc(v.youtube_display_name)}）`:''}</p></div><div><b>Discord</b><p>${esc(v.discord_username||'—')}<br><span class="muted">${esc(v.discord_user_id||'')}</span></p></div></div>
    <p><b>花生證</b><br>${seasons}</p>
    <h3>Last Action Timeline</h3>${table('search_timeline_'+vid,timeline,[['時間','created_at'],['type','_type'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status||r.change_type||'')}</span>`,'status'],['detail',r=>esc(r.message||r.source_event_id||r.change_type||r.leaderboard_key||'')]])}
    <h3>S57 Redeem History</h3>${table('search_s57_'+vid,s57,[['時間','created_at'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status)}</span>`,'status'],['扣分',r=>`${esc(r.before_points)} → ${esc(r.after_points)}`,'after_points'],['message','message']])}
    <h3>PTS Redeem History</h3>${table('search_pts_'+vid,pts,[['時間','created_at'],['PTS',r=>`${esc(r.before_points)} → ${esc(r.after_points)}`,'after_points'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status)}</span>`,'status'],['event','source_event_id']])}
    <h3>Discord / Identity History</h3>${table('search_discord_'+vid,ds,[['時間','created_at'],['season','season_number'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status)}</span>`,'status'],['message','message']])}${idc.length?table('search_identity_'+vid,idc,[['時間','created_at'],['type','change_type'],['Twitch',r=>`${esc(r.old_twitch_login||r.old_twitch_user_id||'')} → ${esc(r.new_twitch_login||r.new_twitch_user_id||'')}`],['YouTube',r=>`${esc(r.old_youtube_handle||r.old_youtube_channel_id||'')} → ${esc(r.new_youtube_handle||r.new_youtube_channel_id||'')}`]]):''}
   </div>`
 }).join('');
 return `<div class="card"><h2>Viewer Search</h2><p class="muted">${matches.length} result(s)</p></div>${cards}`;
}
function healthText(v){return v===true?'active':(v===false?'not active':'unknown')}
function healthClass(v){return v===true?'ok':(v===false?'bad':'warn')}
function render(d){
 if(!d){root.innerHTML='<p class="muted">未有 admin snapshot。</p>';return}
 const h=d.health||{}, failed=d.failed||{};
 root.innerHTML=`
 <div class="grid">
  <div class="card"><h2>System Health</h2><p>Generated: <span class="mono">${esc(d.generated_at)}</span></p><p>Sync: <span class="${h.sync_active?'ok':'bad'}">${h.sync_active?'active':'not active'}</span></p><p>Peanut service: <span class="${healthClass(h.peanut_service_active)}">${healthText(h.peanut_service_active)}</span></p><p class="muted small">${esc(h.peanut_service_message||'')}</p><p>Windows DB: <span class="${h.windows_leaderboard_ok?'ok':'bad'}">${h.windows_leaderboard_ok?'OK':'error'}</span></p><p class="muted small">${esc(h.windows_leaderboard_message||'')}</p></div>
  <div class="card"><h2>Active Needs Attention</h2><p>Failed S57: <b class="${failed.s57?.length?'bad':'ok'}">${failed.s57?.length||0}</b></p><p>Failed PTS: <b class="${failed.points?.length?'bad':'ok'}">${failed.points?.length||0}</b></p><p>Discord errors: <b class="${failed.discord?.length?'bad':'ok'}">${failed.discord?.length||0}</b></p></div>
 </div>
 ${viewerSearchHtml(d)}
 <div class="card"><h2>S57 Redeem Status</h2><p class="muted">可直接喺表格入面 scroll。</p>${table('s57', d.s57_redeems||[], [['時間','created_at'],['viewer',r=>`${userLabel(r)}<br><span class="muted">viewer_id ${esc(r.viewer_id)}</span>`,'viewer_label'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status)}</span>`,'status'],['扣分',r=>`${esc(r.before_points)} → ${esc(r.after_points)}`,'after_points'],['key','leaderboard_key'],['message','message']])}</div>
 <div class="card"><h2>PTS Channel Point Redeems</h2>${table('points', d.points_redeems||[], [['時間','created_at'],['user',r=>`${userLabel(r)}<br><span class="muted">${esc(r.platform_user_id)}</span>`,'platform_login'],['PTS',r=>`${esc(r.before_points)} → ${esc(r.after_points)}`,'after_points'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status)}</span>`,'status'],['event','source_event_id']])}</div>
 <div class="card"><h2>Previous Error Log</h2><p class="muted">已修好/已重新成功嘅舊錯會放呢度，不計入 Active。</p>
   <h3>S57 previous errors</h3>${table('prev_s57', d.previous_errors?.s57||[], [['時間','created_at'],['viewer',r=>`${userLabel(r)}<br><span class="muted">viewer_id ${esc(r.viewer_id)}</span>`,'viewer_label'],['status','status'],['message','message']])}
   <h3>Discord previous errors</h3><p class="muted small">Unknown Member 通常代表對方未入 Discord server，或 linked 咗另一個 Discord account；要對方入 server / 重新連結 Discord 後再同步。</p>${table('prev_discord', d.previous_errors?.discord||[], [['時間','created_at'],['viewer','viewer_id'],['season','season_number'],['status','status'],['message','message']])}
 </div>
 <div class="card"><h2>Discord Sync</h2>${table('discord', d.discord_sync||[], [['時間','created_at'],['viewer','viewer_id'],['season','season_number'],['status',r=>`<span class="${cls(r.status)}">${esc(r.status)}</span>`,'status'],['message','message']])}</div>
 <div class="card"><h2>Identity Changes</h2>${table('identity', d.identity_changes||[], [['時間','created_at'],['viewer','viewer_id'],['type','change_type'],['Twitch',r=>`${esc(r.old_twitch_login||r.old_twitch_user_id||'')} → ${esc(r.new_twitch_login||r.new_twitch_user_id||'')}`,'new_twitch_login'],['YouTube',r=>`${esc(r.old_youtube_handle||r.old_youtube_channel_id||'')} → ${esc(r.new_youtube_handle||r.new_youtube_channel_id||'')}`,'new_youtube_handle']])}</div>
 <div class="card" id="gearCatalogCard"><h2>Gear Catalog <span class="muted small">(Database)</span></h2><div id="gearCatalogRoot"><p class="muted">載入中...</p></div></div>
 `; loadGearCatalog();
}
let currentData=null;
async function load(){status.textContent='載入中...';try{const r=await fetch(`${API}/profile/admin/status`,{credentials:'include'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||`HTTP ${r.status}`);status.textContent=`更新：${j.updated_at||'未有'}`;currentData=j.data;render(j.data)}catch(e){status.textContent='';root.innerHTML=`<p class="bad">載入失敗：${esc(e.message)}</p><p class="muted">請先用 Jimpae account 登入 /profile。</p>`}}
root.addEventListener('click', e=>{
 const th=e.target.closest('th[data-sort]'); if(!th) return;
 const tableEl=th.closest('table[data-table]'); if(!tableEl) return;
 const id=tableEl.dataset.table; const idx=Number(th.dataset.sort);
 const cur=sortState[id]||{idx:0,dir:'desc'};
 sortState[id]={idx,dir:(cur.idx===idx&&cur.dir==='asc')?'desc':'asc'};
 if(currentData) render(currentData);
});
refresh.onclick=load;
searchBtn.onclick=()=>{ if(currentData) render(currentData); };
viewerSearch.addEventListener('keydown', e=>{ if(e.key==='Enter'&&currentData) render(currentData); });
load();
/* ───────── Gear Catalog Manager ───────── */
let cachedGears=[];
async function loadGearCatalog(){
  const root=document.getElementById('gearCatalogRoot');
  if(!root) return;
  try{
    const r=await fetch(`${API}/admin/gear-catalog`,{credentials:'include'});
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error(j.error||`HTTP ${r.status}`);
    cachedGears=j.gears||[];
    renderGearCatalog(cachedGears);
  }catch(e){
    root.innerHTML=`<p class="bad">載入失敗：${esc(e.message)}</p>`;
  }
}
function renderGearCatalog(gears){
  const root=document.getElementById('gearCatalogRoot');
  if(!root) return;
  // Save add-form state before re-render
  const saved = {
    set: document.getElementById('gcNewSet')?.value||'',
    setLabel: document.getElementById('gcNewSetLabel')?.value||'',
    piece: document.getElementById('gcNewPiece')?.value||'',
    label: document.getElementById('gcNewLabel')?.value||'',
    price: document.getElementById('gcNewPrice')?.value||'0',
    sort: document.getElementById('gcNewSort')?.value||'0',
  };
  // Group by set for collapsible sections
  const bySet={};
  for(const g of gears){
    const s=g.gear_set||'other';
    if(!bySet[s]) bySet[s]={label:g.set_label||s,items:[]};
    bySet[s].items.push(g);
  }
  const setNames=Object.keys(bySet).sort((a,b)=>a.localeCompare(b));
  // Add form
  let html=`<div class="toolbar">
    <button id="gearCatalogRefresh" onclick="loadGearCatalog()">重新整理</button>
    <button id="gearSeedBtn">從 Manifest Seed</button>
    <span class="muted small">${gears.length} 件裝備</span>
  </div>
  <div id="gearAddForm" class="card" style="margin-bottom:14px">
    <h3>新增 Gear</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:end">
      <label class="small">Set<br><input id="gcNewSet" placeholder="jp_hats" style="width:120px"/></label>
      <label class="small">Set Label<br><input id="gcNewSetLabel" placeholder="Hats" style="width:100px"/></label>
      <label class="small">Piece<br><input id="gcNewPiece" placeholder="cat_ears" style="width:120px"/></label>
      <label class="small">Label<br><input id="gcNewLabel" placeholder="Cat Ears" style="width:120px"/></label>
      <label class="small">Price<br><input id="gcNewPrice" type="number" min="0" value="0" style="width:70px"/></label>
      <label class="small">Sort<br><input id="gcNewSort" type="number" min="0" value="0" style="width:50px"/></label>
      <button id="gcAddBtn">新增</button>
    </div>
  </div>`;
  for(const setName of setNames){
    const grp=bySet[setName];
    const items=grp.items;
    html+=`<div class="card" style="margin-bottom:10px">
      <h3>${esc(grp.label||setName)} <span class="muted small">${items.length} 件</span></h3>
      ${table('gc_'+setName,items,[
        ['ID','id'],
        ['Piece',r=>`${esc(r.gear_piece)}`,'gear_piece'],
        ['Label',r=>`<input class="gc-edit" data-field="label" data-id="${r.id}" value="${esc(r.label||'')}" style="width:130px"/>`,'label'],
        ['Set',r=>`<span class="muted small">${esc(r.gear_set)}</span>`,'gear_set'],
        ['Price',r=>`<input class="gc-edit" data-field="price" data-id="${r.id}" type="number" min="0" value="${Number(r.price)}" style="width:70px"/>`,'price'],
        ['Sort',r=>`<input class="gc-edit" data-field="sort_order" data-id="${r.id}" type="number" min="0" value="${Number(r.sort_order)}" style="width:50px"/>`,'sort_order'],
        ['Enabled',r=>`<button class="gc-toggle" data-id="${r.id}" data-enabled="${r.enabled?1:0}" style="${r.enabled?'background:#1f6e4a;color:#fff':'background:#6a2323;color:#ddd'}">${r.enabled?'✔️':'❌'}</button>`,'enabled'],
        ['Delete',r=>`<button class="gc-del" data-id="${r.id}" style="background:#661111">刪除</button>`,'id'],
      ])}
    </div>`;
  }
  root.innerHTML=html;
  // Restore add-form state after re-render
  const setEl = document.getElementById('gcNewSet');
  if (setEl) { setEl.value = saved.set;
    document.getElementById('gcNewSetLabel').value = saved.setLabel;
    document.getElementById('gcNewPiece').value = saved.piece;
    document.getElementById('gcNewLabel').value = saved.label;
    document.getElementById('gcNewPrice').value = saved.price;
    document.getElementById('gcNewSort').value = saved.sort; }
}
// Gear CRUD handlers
document.addEventListener('click', async e=>{
  const seedBtn=e.target.closest('#gearSeedBtn');
  if(seedBtn){
    seedBtn.disabled=true; seedBtn.textContent='Seeding...';
    try{
      const gearList=[];
      // Extract gear from manifest.json... we'll send sets & pieces inline
      const manifest=await fetch('/assets/avatar-renders/gear-manifest.json').then(r=>r.json()).catch(()=>({}));
      const seen=new Set();
      for(const v of (manifest.viewers||[])){
        for(const p of Object.values(v.platforms||{})){
          for(const item of (p.owned||[])){
            const key=item.set+'|'+item.piece;
            if(seen.has(key)) continue;
            seen.add(key);
            gearList.push({gear_set:item.set, set_label:item.set_label||'', gear_piece:item.piece, label:item.label, price:0, sort_order:0});
          }
        }
      }
      if(!gearList.length) throw new Error('No gears found in manifest');
      const r=await fetch(`${API}/admin/gear-catalog/seed`,{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({gears:gearList})});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||`HTTP ${r.status}`);
      alert(`Seeding 完成：新增 ${j.added} 件，跳過 ${j.skipped} 件`);
      loadGearCatalog();
    }catch(e){alert('Seed 失敗：'+e.message);}
    seedBtn.disabled=false; seedBtn.textContent='從 Manifest Seed';
    return;
  }
  const toggleBtn=e.target.closest('.gc-toggle');
  if(toggleBtn){
    const id=Number(toggleBtn.dataset.id);
    const enabled=toggleBtn.dataset.enabled==='1'?0:1;
    toggleBtn.disabled=true;
    try{
      const r=await fetch(`${API}/admin/gear-catalog/${id}`,{method:'PUT',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({enabled})});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||`HTTP ${r.status}`);
      loadGearCatalog();
    }catch(e){alert('切換失敗：'+e.message);toggleBtn.disabled=false;}
    return;
  }
  const delBtn=e.target.closest('.gc-del');
  if(delBtn&&confirm('軟刪除此 gear？')){
    const id=Number(delBtn.dataset.id);
    delBtn.disabled=true;
    try{
      const r=await fetch(`${API}/admin/gear-catalog/${id}`,{method:'DELETE',credentials:'include',headers:{'content-type':'application/json'}});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||`HTTP ${r.status}`);
      loadGearCatalog();
    }catch(e){alert('刪除失敗：'+e.message);delBtn.disabled=false;}
    return;
  }
  const addBtn=e.target.closest('#gcAddBtn');
  if(addBtn){
    const gearSet=document.getElementById('gcNewSet')?.value?.trim();
    const setLabel=document.getElementById('gcNewSetLabel')?.value?.trim();
    const gearPiece=document.getElementById('gcNewPiece')?.value?.trim();
    const label=document.getElementById('gcNewLabel')?.value?.trim();
    const price=Number(document.getElementById('gcNewPrice')?.value||0);
    const sort_order=Number(document.getElementById('gcNewSort')?.value||0);
    if(!gearSet||!gearPiece||!label){alert('Set、Piece、Label 必填');return;}
    addBtn.disabled=true;
    try{
      const r=await fetch(`${API}/admin/gear-catalog`,{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({gear_set:gearSet, set_label:setLabel, gear_piece:gearPiece, label, price, sort_order})});
      const j=await r.json();
      if(!r.ok||!j.ok) throw new Error(j.error||`HTTP ${r.status}`);
      loadGearCatalog();
    }catch(e){alert('新增失敗：'+e.message);}
    addBtn.disabled=false;
    return;
  }
});
// Inline edit: save on blur/enter
document.addEventListener('change', async e=>{
  const inp=e.target.closest('.gc-edit');
  if(!inp) return;
  const id=Number(inp.dataset.id);
  const field=inp.dataset.field;
  const value=inp.value?.trim?.()??inp.value;
  inp.disabled=true;
  try{
    const body={[field]:field==='price'||field==='sort_order'?Number(value):value};
    const r=await fetch(`${API}/admin/gear-catalog/${id}`,{method:'PUT',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error(j.error||`HTTP ${r.status}`);
  }catch(e){alert('更新失敗：'+e.message);}
  inp.disabled=false;
});
// Gear catalog loaded inside render() after div is created
</script></body></html>
